name: 자료 업로드
description: 과목과 회차를 선택하고 과제 또는 정답 파일을 공유해요.
title: "[자료 공유] "
labels: ["자료공유"]
body:
  - type: markdown
    attributes:
      value: |
        이 저장소는 공개되어 있어 업로드한 파일과 작성 내용은 누구나 볼 수 있습니다.
        저작권상 공유가 허용된 자료만 올리고, 이름·학번 등 개인정보는 가려 주세요.
  - type: dropdown
    id: subject
    attributes:
      label: 과목
      options:
        - 수학
        - 물리
        - 화학
        - 지성의 열쇠
        - 기타 교양
        - 그 밖의 과목
    validations:
      required: true
  - type: input
    id: round
    attributes:
      label: 회차
      description: "예: 1회차, 중간고사, 2026-10-04"
      placeholder: 1회차
    validations:
      required: true
  - type: dropdown
    id: material_type
    attributes:
      label: 자료 종류
      options:
        - 과제
        - 정답
        - 과제와 정답
        - 보충 자료
    validations:
      required: true
  - type: upload
    id: files
    attributes:
      label: 파일 첨부
      description: 파일을 끌어 놓거나 눌러 선택하세요. 여러 파일을 올릴 때는 한 번에 첨부하거나 ZIP으로 묶어 주세요.
    validations:
      required: true
      accept: ".pdf,.docx,.xlsx,.pptx,.zip,.gz,.png,.jpg,.jpeg,.gif,.svg,.webp,.txt,.csv,.json"
  - type: textarea
    id: note
    attributes:
      label: 한 줄 설명 (선택)
      description: 자료에 대한 안내가 있다면 적어 주세요.
      placeholder: 문제 풀이와 정답을 함께 올립니다.
    validations:
      required: false
  - type: checkboxes
    id: sharing_permission
    attributes:
      label: 공개 공유 확인
      options:
        - label: 이 자료를 공개 공유할 권한이 있고, 개인정보가 포함되지 않았음을 확인합니다.
          required: true
