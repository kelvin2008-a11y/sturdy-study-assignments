name: 자료 업로드
description: 과목과 회차를 선택하고 과제 또는 정답 파일을 공유해요.
title: "[자료 공유] "
labels: ["자료공유"]
body:
  - type: markdown
    attributes:
      value: |
        저장소와 게시 내용은 공개되지만, 업로드 파일은 홈페이지의 **파일 암호화** 도구로 암호화한 ZIP만 첨부해 주세요.
        암호는 게시물에 적지 말고 자료를 받을 사람에게 별도로 알려 주세요. 원본 파일을 직접 첨부하면 누구나 다운로드할 수 있습니다.
        저작권상 공유가 허용된 자료만 올리고, 이름·학번 등 개인정보는 가려 주세요.
  - type: dropdown
    id: subject
    attributes:
      label: 과목
      options:
        - 수학
        - 물리
        - 화학
        - 지성의 열쇠
        - 기타 교양
        - 그 밖의 과목
    validations:
      required: true
  - type: input
    id: round
    attributes:
      label: 회차
      description: "예: 1회차, 중간고사, 2026-10-04"
      placeholder: 1회차
    validations:
      required: true
  - type: dropdown
    id: material_type
    attributes:
      label: 자료 종류
      options:
        - 과제
        - 정답
        - 과제와 정답
        - 보충 자료
    validations:
      required: true
  - type: upload
    id: files
    attributes:
      label: 파일 첨부
      description: 홈페이지의 파일 암호화 도구로 만든 ZIP을 첨부하세요. 25MB 이하만 지원됩니다.
    validations:
      required: true
      accept: ".zip"
  - type: textarea
    id: note
    attributes:
      label: 한 줄 설명 (선택)
      description: 자료에 대한 안내가 있다면 적어 주세요.
      placeholder: 문제 풀이와 정답을 함께 올립니다.
    validations:
      required: false
  - type: checkboxes
    id: encryption_confirmed
    attributes:
      label: 암호화 확인
      options:
        - label: 홈페이지의 파일 암호화 도구로 만든 ZIP이며, 원본 파일이나 비밀번호를 첨부하지 않았습니다.
          required: true
  - type: checkboxes
    id: sharing_permission
    attributes:
      label: 공개 공유 확인
      options:
        - label: 이 자료를 공개 공유할 권한이 있고, 개인정보가 포함되지 않았음을 확인합니다.
          required: true
